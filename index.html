<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Motul / MotulTech – Lubricant Equivalence Report</title>
<style>
:root{--red:#ED1C24;--red2:#B3121A;--ink:#1A1A1A;--grey:#58595B;--muted:#8A8D91;--line:#E1E3E6;--bg:#F4F5F7;
--eq:#2E6B3A;--eqb:#EAF6EC;--eql:#BFE0C6;--up:#1F5FA8;--upb:#E6F0FA;--upl:#B9D3F0;--dn:#9C7A00;--dnb:#FFF8DC;--dnl:#EBDDA0}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hbar{max-width:1480px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.hbar .logo{height:34px;background:#fff;border-radius:3px}
.htitle{flex:1;min-width:220px}
.htitle b{display:block;font-size:17px}
.htitle span{font-size:12px;color:#C9CBCF}
.btn{border:1px solid #555;background:#2A2A2A;color:#fff;padding:8px 13px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{background:#3a3a3a}.btn:focus-visible,.chip:focus-visible,.grp:focus-visible,.dcard:focus-visible{outline:3px solid #FFB3B6;outline-offset:2px}
.btn.red{background:var(--red);border-color:var(--red)}.btn.red:hover{background:var(--red2)}
.lang{display:flex;border:1px solid #666;border-radius:6px;overflow:hidden}
.lang button{background:transparent;color:#ccc;border:0;padding:8px 12px;cursor:pointer;font-weight:700}
.lang button.on{background:#fff;color:var(--ink)}
main{max-width:1480px;margin:auto;padding:16px 18px 40px}
.hero{background:linear-gradient(135deg,#fff 0%,#fff 60%,#FDECEC 100%);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:10px;padding:16px 20px;margin-bottom:14px}
.kicker{color:var(--red);font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
.hero h1{margin:4px 0 6px;font-size:21px;line-height:1.3}
.hero ul{margin:6px 0 0;padding-left:18px;color:var(--grey);line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grey)}
.kpi.k-eq:before{background:var(--eq)}.kpi.k-up:before{background:var(--up)}.kpi.k-dn:before{background:var(--dn)}.kpi.k-red:before{background:var(--red)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:27px;font-weight:800;margin-top:2px}
.kpi .s{font-size:12px;color:var(--grey)}
.k-eq .v{color:var(--eq)}.k-up .v{color:var(--up)}.k-dn .v{color:var(--dn)}
.decide{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.dcard{border-radius:10px;padding:12px 14px;border:1px solid var(--line);cursor:pointer;transition:.15s}
.dcard:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.dcard.active{outline:2px solid var(--ink)}
.dcard h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.dcard p{margin:0;font-size:12.5px;color:var(--grey);line-height:1.45}
.dcard .who{margin-top:6px;font-size:11.5px;color:var(--muted)}
.d-eq{background:var(--eqb)}.d-eq h3{color:var(--eq)}.d-up{background:var(--upb)}.d-up h3{color:var(--up)}.d-dn{background:var(--dnb)}.d-dn h3{color:var(--dn)}
.sym{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:6px;font-weight:900;font-size:15px;flex:none}
.s-eq{background:var(--eqb);color:var(--eq);border:1px solid var(--eql)}.s-up{background:var(--upb);color:var(--up);border:1px solid var(--upl)}.s-dn{background:var(--dnb);color:var(--dn);border:1px solid var(--dnl)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12px}
.searchbox input{width:100%;padding:13px 14px;border:2px solid var(--ink);border-radius:9px;font-size:15px;outline:none}
.searchbox input:focus{border-color:var(--red)}
.answers{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:8px}
.ans{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;gap:10px;align-items:flex-start;background:#FCFCFD}
.ans.a-eq{border-left:4px solid var(--eq)}.ans.a-up{border-left:4px solid var(--up)}.ans.a-dn{border-left:4px solid var(--dn)}
.ans .t{font-size:13px;line-height:1.4}
.ans .t b.mo{color:var(--red2)}
.ans .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.why{font-size:11.8px;margin-top:4px;padding:4px 7px;border-radius:5px;background:#F4F6F9;color:#3B4656;line-height:1.4}
.why.w-up{background:var(--upb);color:#174A85}.why.w-dn{background:var(--dnb);color:#7A5F00}
.brands{display:flex;gap:8px;flex-wrap:wrap}
.bchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;cursor:pointer;font-size:12px}
.bchip.on{border:2px solid var(--red);padding:5px 9px}
.bchip img{height:22px;max-width:70px;object-fit:contain}
.bchip .mini{display:flex;gap:4px;font-weight:700}
.bchip .mini i{font-style:normal}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:180px;flex:1}
.f label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.f select{padding:9px 10px;border:1px solid #C9C9C9;border-radius:7px;font-size:13px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #C9C9C9;background:#fff;border-radius:20px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.link{background:none;border:0;color:var(--red2);cursor:pointer;font-weight:700;font-size:12.5px;padding:8px 4px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px}
.grp{border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;background:#fff}
.grp:hover{border-color:var(--grey)}.grp.on{border:2px solid var(--red);padding:8px 10px}
.grp .gn{font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.grp .gn span{color:var(--muted);font-weight:600;white-space:nowrap}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:#EEE;margin-top:6px}
.bar i{display:block;height:100%}.b-eq{background:#4E9A5E}.b-up{background:#3D7CC9}.b-dn{background:#D9B11E}
.gl{font-size:11px;color:var(--grey);margin-top:4px}
.tablewrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px}
th{position:sticky;top:0;background:#1A1A1A;color:#fff;text-align:left;padding:9px 10px;font-size:12px;cursor:pointer;user-select:none;white-space:nowrap;z-index:2}
th:hover{background:#333}th .ar{opacity:.5;margin-left:4px}th.sorted .ar{opacity:1;color:#FF8A8F}
td{padding:8px 10px;border-bottom:1px solid #EEF0F2;vertical-align:top;font-size:12.8px}
tr.r-eq td.cmp{background:var(--eqb)}tr.r-up td.cmp{background:var(--upb)}tr.r-dn td.cmp{background:var(--dnb)}
td.mot{font-weight:700;color:var(--red2);min-width:150px}
td.spec{font-size:12px;color:#44546A;min-width:170px}
td.cmp{min-width:360px}
.cmpline{display:flex;gap:8px;align-items:flex-start}
.verdict{font-size:11.5px;font-weight:700;margin-top:3px}
.v-eq{color:var(--eq)}.v-up{color:var(--up)}.v-dn{color:var(--dn)}
td.note{color:var(--grey);font-size:11.8px;max-width:330px;line-height:1.4}
td.grpc{font-size:11.5px;color:var(--grey);max-width:190px}
.count{font-size:12.5px;color:var(--grey);margin:8px 0}
mark{background:#FFE58A;padding:0 1px;border-radius:2px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:11px 15px;border-radius:8px;font-size:13px;display:none;z-index:50;max-width:420px}
.foot{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.decide{grid-template-columns:1fr}}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:1fr}.hbar .logo{display:none}.hero h1{font-size:18px}}
@media print{header .btn,header .lang,.searchbox,.filters{display:none}.tablewrap{max-height:none;overflow:visible}}
</style>
</head>

/* ---- automatic short technical note for ▲ / ▼ (bilingual) ---- */
function autoNote(r){
  const m=r.m,sp=r.sp,c=r.c,s=r.s,U=x=>x.toUpperCase();
  const N=(vi,en)=>({vi,en});
  if(s==="▲"){
    if(/CH-4/i.test(c)&&/CI-4/i.test(sp)) return N("Motul API CI-4 > CH-4: kiểm soát muội than & mài mòn tốt hơn, phù hợp động cơ có EGR.","Motul API CI-4 > CH-4: better soot and wear control, suited to EGR engines.");
    if(/CK-4/i.test(c)&&/10W-40/i.test(sp)&&/15W-40/i.test(c)) return N("Cùng API CK-4; Motul 10W-40 (ACEA E11) – khởi động lạnh nhanh hơn, tiết kiệm nhiên liệu. Kiểm tra cấp SAE OEM cho phép.","Same API CK-4; Motul 10W-40 (ACEA E11) – faster cold start, fuel saving. Check SAE grade allowed by OEM.");
    if(/tổng hợp|synth/i.test(sp)&&/CI-4/i.test(c)) return N("Cùng API CI-4; Motul công nghệ tổng hợp – bền oxy hóa hơn, hỗ trợ kéo dài chu kỳ thay dầu.","Same API CI-4; Motul synthetic technology – higher oxidation stability, supports longer drains.");
    if(/GL-4/i.test(c)&&/GL-5/i.test(sp)) return N("Motul API GL-5 > GL-4: phụ gia EP cao hơn, chịu tải sốc – dùng được cho cầu hypoid. Hộp số có đồng tốc đồng thau: theo OEM.","Motul API GL-5 > GL-4: higher EP, shock-load protection – suits hypoid axles. Brass-synchro gearboxes: follow OEM.");
    if(/non-EP/i.test(c)) return N("Motul mỡ Lithium EP – chịu tải nặng & va đập tốt hơn mỡ non-EP.","Motul Lithium EP grease – better heavy-load and shock protection than non-EP grease.");
    if(/R&O/i.test(c)&&/đa năng|multi/i.test(sp)) return N("Motul đa năng (chống mài mòn + rãnh trượt) vượt cấp dầu R&O – dùng chung cho nhiều điểm bôi trơn.","Motul multipurpose (anti-wear + slideway) exceeds R&O oil – one oil for several lube points.");
    if(/Morlina S2 B /i.test(c)&&/ổ trượt|bearing|cán/i.test(sp)) return N("Motul chuyên cho ổ màng dầu cán thép (tách nước tốt, có phụ gia chuyên dụng) – vượt cấp dầu tuần hoàn R&O.","Motul designed for steel-mill oil-film bearings (good water separation, dedicated additives) – exceeds R&O circulating oil.");
    return N("Motul đạt cấp hiệu năng cao hơn SP đối thủ – xem thông số chính.","Motul meets a higher performance level than the competitor – see key spec.");
  }
  if(s==="▼"){
    if(/DTE 10 Excel/i.test(c)) return N("Đối thủ là dầu HV cao cấp (bền cắt, tiết kiệm năng lượng). Motul thay được khi OEM chỉ yêu cầu HV/HVLP.","Competitor is a premium HV oil (shear-stable, energy-saving). Motul fits when OEM only requires HV/HVLP.");
    if(/Hyspin HVI/i.test(c)) return N("Khác hệ phụ gia/định vị so với Rubric HV – kiểm tra yêu cầu OEM (HV, có/không kẽm) trước khi thay.","Different additive system/positioning vs Rubric HV – check OEM requirement (HV, zinc/zinc-free) before switching.");
    if(/Morlina|Renolin DTA/i.test(c)) return N("Đối thủ là dầu tuần hoàn chuyên dụng (tách nước, hệ phụ gia riêng). Kiểm tra yêu cầu tách nước & OEM (máy giấy, cán).","Competitor is a dedicated circulating oil (demulsibility, specific additives). Check water-separation & OEM needs (paper, rolling mills).");
    if(/Corena S4/i.test(c)) return N("Đối thủ định vị dòng cao cấp, chu kỳ thay dài hơn – kiểm tra chu kỳ & khuyến cáo nhà sản xuất máy nén.","Competitor is a premium tier with longer drain claims – check drain interval & compressor OEM advice.");
    return N("Có khác biệt về công nghệ/phụ gia/phê duyệt – kiểm tra TDS & OEM trước khi thay.","Differences in technology/additives/approvals – check TDS & OEM before switching.");
  }
  return null;
}
function noteText(r){ if(r.n) return r.n; const a=r.auto; return a?a[lang]:""; }

function setData(list,name){

     .filter(r=>SYMS.includes(r.s)&&r.c&&r.m);
  rows.forEach(r=>{r.auto=autoNote(r);r.k=norm([r.m,r.c,r.b,r.sp].join(" "));r.kc=compact([r.m,r.c,r.b].join(" "));});

/* ---------- XLSX reader (no external library) ---------- */
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let eo=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-70000);i--)if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
  if(eo<0)throw new Error("not zip");
  const n=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);const files={};
  for(let k=0;k<n;k++){const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));files[name]={meth,cs,lo};p+=46+nl+el+cl;}
  return async name=>{const f=files[name];if(!f)return null;
    const ln=dv.getUint16(f.lo+26,true),le=dv.getUint16(f.lo+28,true),s0=f.lo+30+ln+le,data=u8.slice(s0,s0+f.cs);
    if(f.meth===0)return new TextDecoder().decode(data);
    const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return await new Response(ds).text();};
}
const P=s=>new DOMParser().parseFromString(s,"application/xml");
const tags=(n,tg)=>Array.from(n.getElementsByTagName(tg));
function colN(ref){const m=ref.match(/^([A-Z]+)(\d+)$/);let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return [+m[2],c];}
async function readXlsx(buf){
  const get=await unzip(buf);
  const ssX=await get("xl/sharedStrings.xml");const ss=ssX?tags(P(ssX),"si").map(si=>tags(si,"t").map(x=>x.textContent).join("")):[];
  const wb=P(await get("xl/workbook.xml")),rel=P(await get("xl/_rels/workbook.xml.rels"));
  const rmap={};tags(rel,"Relationship").forEach(r=>rmap[r.getAttribute("Id")]=r.getAttribute("Target"));
  const sheets=tags(wb,"sheet").map(s=>{let tg=rmap[s.getAttribute("r:id")]||rmap[s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id")]||"";
    tg=tg.replace(/^\/?xl\//,"").replace(/^\//,"");return {name:s.getAttribute("name"),path:"xl/"+tg};});
  const order=[...sheets.filter(s=>/^data$/i.test(s.name)),...sheets.filter(s=>/equivalence/i.test(s.name)),...sheets];
  for(const sh of order){
    const x=await get(sh.path);if(!x)continue;
    const g={};let maxR=0,maxC=0;
    tags(P(x),"c").forEach(c=>{const r=c.getAttribute("r");if(!r)return;const [ri,ci]=colN(r);const ty=c.getAttribute("t");let v="";
      if(ty==="s"){const vv=c.getElementsByTagName("v")[0];v=vv?ss[+vv.textContent]:"";}
      else if(ty==="inlineStr")v=tags(c,"t").map(z=>z.textContent).join("");
      else{const vv=c.getElementsByTagName("v")[0];v=vv?vv.textContent:"";}
      if(v!==""){(g[ri]||(g[ri]={}))[ci]=String(v);maxR=Math.max(maxR,ri);maxC=Math.max(maxC,ci);}});
    const res=parseFlat(g,maxR,maxC)||parseLayout(g,maxR,maxC);
    if(res&&res.length)return res;
  }
  return [];
}
const cell=(g,r,c)=>((g[r]||{})[c]||"").trim();

function parseLayout(g,R,C){

  if(!hr)return null;
  let noteC=0;const br=[];
  for(let c=4;c<=C;c++){const v=cell(g,hr,c);if(!v)continue;if(/note|ghi ch/i.test(v)){noteC=c;continue;}br.push({name:v,c});}
  br.forEach(b=>{b.paired=!cell(g,hr,b.c+1)&&noteC!==b.c+1;});
  const out=[];let grp="",m="",sp="",nt="";
  for(let r=hr+1;r<=R;r++){
    const a=cell(g,r,1),b=cell(g,r,2);
    if(/^(THỐNG KÊ|STATISTIC|Cách dùng)/i.test(a))break;
    const any=br.some(x=>cell(g,r,x.c));
    if(a&&!b&&!any&&isNaN(+a)){grp=a;continue;}
    if(b){m=b;sp=cell(g,r,3);nt=noteC?cell(g,r,noteC):"";}
    if(!m)continue;
    br.forEach(x=>{
      if(x.paired){const s=cell(g,r,x.c),p=cell(g,r,x.c+1);if(SYMS.includes(s)&&p)out.push([grp,m,sp,x.name,s,p,nt]);}

    });
  }
