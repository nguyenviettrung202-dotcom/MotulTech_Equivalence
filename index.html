<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motul / MotulTech – Lubricant Equivalence Finder</title>
<style>
:root{--red:#ED1C24;--red2:#B3121A;--ink:#1A1A1A;--grey:#58595B;--muted:#8A8D91;--line:#E1E3E6;--bg:#F4F5F7;--card:#fff;
--eq:#2E6B3A;--eqb:#EAF6EC;--up:#1F5FA8;--upb:#E6F0FA;--dn:#9C7A00;--dnb:#FFF8DC}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hbar{max-width:1440px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.hbar img{height:34px;background:#fff;border-radius:3px}
.htitle{flex:1;min-width:220px}
.htitle b{display:block;font-size:17px;letter-spacing:.2px}
.htitle span{font-size:12px;color:#C9CBCF}
.btn{border:1px solid #555;background:#2A2A2A;color:#fff;padding:8px 13px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:#3a3a3a}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.red:hover{background:var(--red2)}
.lang{display:flex;border:1px solid #666;border-radius:6px;overflow:hidden}
.lang button{background:transparent;color:#ccc;border:0;padding:8px 12px;cursor:pointer;font-weight:700}
.lang button.on{background:#fff;color:var(--ink)}
main{max-width:1440px;margin:auto;padding:16px 18px 40px}
.hero{background:linear-gradient(135deg,#fff 0%,#fff 60%,#FDECEC 100%);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:10px;padding:16px 20px;margin-bottom:14px}
.kicker{color:var(--red);font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
.hero h1{margin:4px 0 6px;font-size:21px}
.hero p{margin:0;color:var(--grey);line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grey)}
.kpi.k-eq:before{background:var(--eq)}.kpi.k-up:before{background:var(--up)}.kpi.k-dn:before{background:var(--dn)}.kpi.k-red:before{background:var(--red)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:27px;font-weight:800;margin-top:2px}
.kpi .s{font-size:12px;color:var(--grey)}
.k-eq .v{color:var(--eq)}.k-up .v{color:var(--up)}.k-dn .v{color:var(--dn)}
.decide{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.dcard{border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.15s}
.dcard:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.dcard.active{outline:2px solid var(--ink)}
.dcard h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.dcard p{margin:0;font-size:12.5px;color:var(--grey);line-height:1.45}
.dcard .who{margin-top:6px;font-size:11.5px;color:var(--muted)}
.d-eq{background:var(--eqb)}.d-eq h3{color:var(--eq)}
.d-up{background:var(--upb)}.d-up h3{color:var(--up)}
.d-dn{background:var(--dnb)}.d-dn h3{color:var(--dn)}
.sym{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:6px;font-weight:900;font-size:15px}
.s-eq{background:var(--eqb);color:var(--eq);border:1px solid #BFE0C6}
.s-up{background:var(--upb);color:var(--up);border:1px solid #B9D3F0}
.s-dn{background:var(--dnb);color:var(--dn);border:1px solid #EBDDA0}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12px}
.searchbox{position:relative}
.searchbox input{width:100%;padding:13px 14px 13px 44px;border:2px solid var(--ink);border-radius:9px;font-size:15px;outline:none}
.searchbox input:focus{border-color:var(--red)}
.searchbox:before{content:"⌕";position:absolute;left:14px;top:7px;font-size:24px;color:var(--grey)}
.answers{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:8px}
.ans{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;gap:10px;align-items:flex-start;background:#FCFCFD}
.ans .t{font-size:13px;line-height:1.4}
.ans .t b{color:var(--red2)}
.ans .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:180px;flex:1}
.f label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.f select{padding:9px 10px;border:1px solid #C9C9C9;border-radius:7px;font-size:13px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #C9C9C9;background:#fff;border-radius:20px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.link{background:none;border:0;color:var(--red2);cursor:pointer;font-weight:700;font-size:12.5px;padding:8px 4px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px}
.grp{border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;background:#fff}
.grp:hover{border-color:var(--grey)}
.grp.on{border:2px solid var(--red);padding:8px 10px}
.grp .gn{font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.grp .gn span{color:var(--muted);font-weight:600;white-space:nowrap}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:#EEE;margin-top:6px}
.bar i{display:block;height:100%}
.bar .b-eq{background:#4E9A5E}.bar .b-up{background:#3D7CC9}.bar .b-dn{background:#D9B11E}
.gl{font-size:11px;color:var(--grey);margin-top:4px}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1050px}
th{position:sticky;top:0;background:#1A1A1A;color:#fff;text-align:left;padding:9px 10px;font-size:12px;cursor:pointer;user-select:none;white-space:nowrap;z-index:2}
th:hover{background:#333}
th .ar{opacity:.5;margin-left:4px}
th.sorted .ar{opacity:1;color:#FF8A8F}
td{padding:8px 10px;border-bottom:1px solid #EEF0F2;vertical-align:top;font-size:12.8px}
tr.r-eq td.cmp{background:var(--eqb)}tr.r-up td.cmp{background:var(--upb)}tr.r-dn td.cmp{background:var(--dnb)}
td.mot{font-weight:700;color:var(--red2)}
td.cmp{min-width:330px}
.cmpline{display:flex;gap:8px;align-items:flex-start}
.cmpline .txt b{color:var(--ink)}
.verdict{font-size:11.5px;font-weight:700;margin-top:3px}
.v-eq{color:var(--eq)}.v-up{color:var(--up)}.v-dn{color:var(--dn)}
td.note{color:var(--grey);font-size:11.8px;max-width:320px}
td.grpc{font-size:11.5px;color:var(--grey);max-width:200px}
.count{font-size:12.5px;color:var(--grey);margin:8px 0}
mark{background:#FFE58A;padding:0 1px;border-radius:2px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:11px 15px;border-radius:8px;font-size:13px;display:none;z-index:50;max-width:420px}
.foot{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.decide{grid-template-columns:1fr}}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:1fr}.hbar img{display:none}}
@media print{header .btn,header .lang,.searchbox,.filters{display:none}.tablewrap{max-height:none;overflow:visible}}
</style>
</head>

  const ps=uniq(rows.filter(r=>!st.group||r.g===st.group).map(r=>r.m));
  if(st.prod&&!ps.includes(st.prod)) st.prod="";
  $("fProd").innerHTML=`<option value="">${t("all")} (${ps.length})</option>`+ps.map(p=>`<option${p===st.prod?" selected":""}>${esc(p)}</option>`).join("");

  $("fBrand").innerHTML=`<option value="">${t("all")}</option>`+bs.map(b=>`<option${b===st.brand?" selected":""}>${esc(b)}</option>`).join("");

}

// ---------- XLSX reader (no external library) ----------
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let eo=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-70000);i--) if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
  if(eo<0) throw new Error("not zip");
  const n=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);const files={};
  for(let k=0;k<n;k++){
    const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    files[name]={meth,cs,lo};p+=46+nl+el+cl;}
  return async name=>{const f=files[name];if(!f) return null;
    const ln=dv.getUint16(f.lo+26,true),le=dv.getUint16(f.lo+28,true),st0=f.lo+30+ln+le,data=u8.slice(st0,st0+f.cs);
    if(f.meth===0) return new TextDecoder().decode(data);
    const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(ds).text();};
}
const P=s=>new DOMParser().parseFromString(s,"application/xml");
const tags=(n,tg)=>Array.from(n.getElementsByTagName(tg));
function colN(ref){const m=ref.match(/^([A-Z]+)(\d+)$/);let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return [+m[2],c];}
async function readXlsx(buf){
  const get=await unzip(buf);
  const ssX=await get("xl/sharedStrings.xml");const ss=ssX?tags(P(ssX),"si").map(si=>tags(si,"t").map(x=>x.textContent).join("")):[];
  const wb=P(await get("xl/workbook.xml")),rel=P(await get("xl/_rels/workbook.xml.rels"));
  const rmap={};tags(rel,"Relationship").forEach(r=>rmap[r.getAttribute("Id")]=r.getAttribute("Target"));
  const sheets=tags(wb,"sheet").map(s=>{let tg=rmap[s.getAttribute("r:id")]||rmap[s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id")];
    tg=tg.replace(/^\/?xl\//,"").replace(/^\//,"");return {name:s.getAttribute("name"),path:"xl/"+tg};});
  const order=[...sheets.filter(s=>/^data$/i.test(s.name)),...sheets.filter(s=>/equivalence/i.test(s.name)),...sheets];
  for(const sh of order){
    const x=await get(sh.path);if(!x) continue;
    const g={};let maxR=0,maxC=0;
    tags(P(x),"c").forEach(c=>{const r=c.getAttribute("r");if(!r)return;const [ri,ci]=colN(r);const ty=c.getAttribute("t");let v="";
      if(ty==="s"){const vv=c.getElementsByTagName("v")[0];v=vv?ss[+vv.textContent]:"";}
      else if(ty==="inlineStr") v=tags(c,"t").map(z=>z.textContent).join("");
      else {const vv=c.getElementsByTagName("v")[0];v=vv?vv.textContent:"";}
      if(v!==""){(g[ri]||(g[ri]={}))[ci]=String(v);maxR=Math.max(maxR,ri);maxC=Math.max(maxC,ci);}});
    const res=parseFlat(g,maxR,maxC)||parseLayout(g,maxR,maxC);
    if(res&&res.length) return res;
  }
  return [];
}
const cell=(g,r,c)=>((g[r]||{})[c]||"").trim();
function parseFlat(g,R,C){
  for(let r=1;r<=Math.min(R,15);r++){
    const h={};for(let c=1;c<=C;c++){const v=norm(cell(g,r,c));
      if(!v) continue;
      if(/^(nhom|group|product group)/.test(v)&&!h.g) h.g=c;
      else if(/motul/.test(v)&&!h.m) h.m=c;
      else if(/(thong so|spec)/.test(v)&&!h.sp) h.sp=c;
      else if(/(ky hieu|symbol|^kh$)/.test(v)&&!h.s) h.s=c;
      else if(/(hang|brand)/.test(v)&&!h.b) h.b=c;
      else if(/(san pham doi thu|competitor)/.test(v)&&!h.c) h.c=c;
      else if(/(ghi chu|note)/.test(v)&&!h.n) h.n=c;}
    if(h.m&&h.s&&h.b&&h.c){const out=[];let lg="",lm="",lsp="";
      for(let i=r+1;i<=R;i++){const m=cell(g,i,h.m)||lm, s=cell(g,i,h.s), c=cell(g,i,h.c);
        const gg=(h.g&&cell(g,i,h.g))||lg, sp=(h.sp&&cell(g,i,h.sp))||(cell(g,i,h.m)?"":lsp);
        if(cell(g,i,h.m)){lm=cell(g,i,h.m);} lg=gg; lsp=sp;
        if(m&&c&&SYMS.includes(s)) out.push([gg,m.replace(/\s*\n\s*/g," / "),sp,cell(g,i,h.b),s,c,h.n?cell(g,i,h.n):""]);}
      return out;}
  }
  return null;
}
function parseLayout(g,R,C){
  let hr=0;for(let r=1;r<=Math.min(R,20);r++) if(/motul/i.test(cell(g,r,2))){hr=r;break;}
  if(!hr) return null;
  let noteC=0;const br=[];
  for(let c=4;c<=C;c++){const v=cell(g,hr,c);if(!v) continue;if(/note|ghi ch/i.test(v)){noteC=c;continue;}br.push({name:v,c});}
  br.forEach((b,i)=>{b.paired=!cell(g,hr,b.c+1)&&!(noteC===b.c+1);});
  const out=[];let grp="",m="",sp="",nt="";
  for(let r=hr+1;r<=R;r++){
    const a=cell(g,r,1),b=cell(g,r,2);
    const any=br.some(x=>cell(g,r,x.c));
    if(a&&!b&&!any&&isNaN(+a)){grp=a;continue;}
    if(/^(THỐNG KÊ|STATISTIC)/i.test(a)) break;
    if(b){m=b.replace(/\s*\n\s*/g," / ");sp=cell(g,r,3);nt=noteC?cell(g,r,noteC):"";}
    if(!m) continue;
    br.forEach(x=>{
      if(x.paired){const s=cell(g,r,x.c),p=cell(g,r,x.c+1);if(SYMS.includes(s)&&p) out.push([grp,m,sp,x.name,s,p,nt]);}
      else cell(g,r,x.c).split(/\n/).forEach(ln=>{ln=ln.trim();const s=ln[0];if(SYMS.includes(s)&&ln.length>1) out.push([grp,m,sp,x.name,s,ln.slice(1).trim(),nt]);});
    });
  }
  return out;
}

function crc32(u){let c,t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}}
  let crc=0xFFFFFFFF;for(let i=0;i<u.length;i++)crc=(crc>>>8)^t[(crc^u[i])&0xFF];return (crc^0xFFFFFFFF)>>>0;}
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  files.forEach(([name,txt])=>{const nb=enc.encode(name),d=enc.encode(txt),crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer),nb,d);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+d.length;});
  const cs=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});}
const xe=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=n=>{let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
function sheetXml(data,widths,extra){
  const rws=data.map((r,i)=>`<row r="${i+1}">`+r.map((v,j)=>v===""||v==null?"":`<c r="${L(j+1)}${i+1}" t="inlineStr"${i===0&&extra.hdr?' s="1"':(j===4&&extra.sym&&i>0?' s="2"':'')}><is><t xml:space="preserve">${xe(v)}</t></is></c>`).join("")+`</row>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${extra.hdr?'<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>':''}<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${rws}</sheetData>${extra.sym?'<dataValidations count="1"><dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="E2:E5000"><formula1>"=,▲,▼"</formula1></dataValidation></dataValidations>':''}</worksheet>`;}
